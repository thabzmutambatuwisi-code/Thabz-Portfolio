<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thabiso | Portfolio</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,Arial,sans-serif;background:#081a4a;color:#f7f8ff;line-height:1.6;padding-left:230px}
a{text-decoration:none;color:inherit}

.sidebar{
position:fixed;
left:0;
top:0;
width:230px;
height:100vh;
background:#06153d;
border-right:1px solid #3159a8;
padding:35px 22px;
z-index:20
}

.sidebar h2{
color:#fff;
margin-bottom:30px
}

.sidebar h2 span{
color:#ff3b3b
}

.sidebar a{
display:block;
padding:13px 14px;
margin:8px 0;
border-radius:12px;
color:#c9cce0
}

.sidebar a:hover{
background:#0d3b99;
color:white
}

.nav{
position:fixed;
top:0;
width:100%;
padding:18px 7%;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(8,26,74,.8);
backdrop-filter:blur(12px);
z-index:10
}

.logo{
font-size:1.3rem;
font-weight:800
}

.logo span{
color:#ff3b3b
}

.links{
display:flex;
gap:24px;
font-size:.95rem;
color:#c9cce0
}

.links a:hover{
color:white
}

.hero{
min-height:100vh;
display:flex;
align-items:center;
padding:110px 7% 70px;
background:
radial-gradient(circle at 75% 30%,#e52b3f 0,transparent 34%),
radial-gradient(circle at 15% 70%,#124bc4 0,transparent 34%),
linear-gradient(135deg,#071b55,#a50f25)
}

.hero-inner{
max-width:850px
}

.tag{
display:inline-block;
padding:8px 14px;
border:1px solid #3c4261;
border-radius:999px;
color:#bfc4e8;
background:#151a31;
margin-bottom:22px
}

.hero h1{
font-size:clamp(3rem,8vw,6.5rem);
line-height:.95;
letter-spacing:-.06em;
margin-bottom:25px
}

.hero h1 span{
color:#124bc4
}

.hero p{
max-width:650px;
color:#eef1ff;
font-size:1.15rem
}

.buttons{
display:flex;
gap:14px;
margin-top:30px;
flex-wrap:wrap
}

.btn{
padding:13px 20px;
border-radius:12px;
background:#e52b3f;
color:#fff;
font-weight:700
}

.btn.alt{
background:#0d3b99;
border:1px solid #4167b8
}

.section{
padding:90px 7%
}

.section h2{
font-size:2.4rem;
margin-bottom:12px
}

.section>p{
color:#d7dcf2;
max-width:680px;
margin-bottom:35px
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:18px
}

.card{
background:#0b235f;
border:1px solid #3159a8;
border-radius:20px;
padding:25px
}

.card h3{
margin-bottom:8px
}

.card p{
color:#d7dcf2
}
